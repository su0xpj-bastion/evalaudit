name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      which:
        description: "core = HumanEval/MBPP audit, rewards = RL reward audit"
        type: choice
        options: [rewards, core, all]
        default: rewards

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  full-audit:
    # Full reproduction on Linux with EvalPlus's default RLIMIT_AS sandbox.
    if: github.event_name == 'workflow_dispatch' && inputs.which != 'rewards'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Machine
        run: nproc; free -g; python --version; pip show evalplus | head -2
      - name: Cheaters + mutation
        run: |
          evalaudit exploits --workers "$(nproc)" --out results/linux
          evalaudit mutation --workers "$(nproc)" --out results/linux
          evalaudit report --out results/linux
      - name: Reliability under load (2x workers per core)
        timeout-minutes: 30
        continue-on-error: true
        run: |
          evalaudit reliability --workers "$(nproc)" --repeats 3 --out results/linux
          evalaudit report --out results/linux
      - name: Official EvalPlus entry point
        if: always()
        env:
          EVALAUDIT_OFFICIAL_OUT: results/linux/official_cli
        run: python scripts/verify_official_cli.py 2>&1 | grep -E "===|tests\)|pass@1" | tee results/linux/official_cli.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-linux
          path: |
            results/linux/*.md
            results/linux/*.json
            results/linux/official_cli.txt

  rewards-audit:
    # RL reward-function audit on Linux. Python 3.10 because BigCodeBench's
    # evaluation requirements are pinned for it (see its Evaluate.Dockerfile).
    if: github.event_name == 'workflow_dispatch' && inputs.which != 'core'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System packages BigCodeBench's tasks need
        run: sudo apt-get update && sudo apt-get install -y python3-tk libgdal-dev r-base libfreetype6-dev libpng-dev pkg-config
      - run: pip install -e ".[rewards]"
      - name: Fetch pinned upstream graders
        run: python -c "from evalaudit.rewards import upstream as u; print(u.fingerprint())"
      - name: BigCodeBench task libraries
        continue-on-error: true
        run: |
          BCB=$(python -c "from evalaudit.rewards import upstream as u; print(u.src('bigcodebench'))")
          pip install numpy==1.24.3 pyarrow==14.0.1 || true
          pip install -r "$BCB/Requirements/requirements-eval.txt" || true
          pip install -e ".[rewards]"
      - name: Machine
        run: nproc; free -g; python --version
      - name: verl / LiveCodeBench / rllm / hardened
        run: python -m evalaudit.rewards apps --workers "$(nproc)" --out results/rewards/linux
      - name: open-r1
        if: always()
        run: python -m evalaudit.rewards openr1 --workers "$(nproc)" --out results/rewards/linux
      - name: BigCodeBench
        if: always()
        timeout-minutes: 150
        run: python -m evalaudit.rewards bcb --workers "$(nproc)" --out results/rewards/linux
      - name: Report
        if: always()
        run: python -m evalaudit.rewards report --out results/rewards/linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-rewards-linux
          path: |
            results/rewards/linux/*.md
            results/rewards/linux/*.json
